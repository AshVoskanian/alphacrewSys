<div class="container-fluid dashboard-page default-dashboard">
  <div class="row dashboard-grid">
    <div class="col-12 col-xl-6 dashboard-widget" *appHasRoles="[dashboardRoles.regions]; type: 'any'">
      <app-social-analytics></app-social-analytics>
    </div>

    <div class="col-12 col-xl-6 dashboard-widget">
      <app-sales-week></app-sales-week>
    </div>

    <div class="col-12 col-xl-6 dashboard-widget" *appHasRoles="[dashboardRoles.dailySms]; type: 'any'">
      <app-dashboard-daily-sms></app-dashboard-daily-sms>
    </div>

    <div class="col-12 col-xl-6 dashboard-widget" *appHasRoles="[dashboardRoles.calendar]; type: 'any'">
      <app-card
        [headerTitle]="'Calendar'"
        [padding]="false"
        [cardBodyClass]="'p-15'">
        <app-calendar-events></app-calendar-events>
      </app-card>
    </div>

    <div class="col-12 col-xl-6 dashboard-widget" *appHasRoles="[dashboardRoles.websiteTraffic]; type: 'any'">
      <app-website-traffic></app-website-traffic>
    </div>

    <div class="col-12 col-xl-6 dashboard-widget" *appHasRoles="[dashboardRoles.financeOverview]; type: 'any'">
      <app-finance-overview></app-finance-overview>
    </div>

    <div class="col-12 col-xl-6 dashboard-widget" *appHasRoles="[dashboardRoles.dataIssues]; type: 'any'">
      <app-dashboard-data-issues></app-dashboard-data-issues>
    </div>

    <div class="col-12 col-xl-6 dashboard-widget" *appHasRoles="[dashboardRoles.warnings]; type: 'any'">
      <app-dashboard-warnings></app-dashboard-warnings>
    </div>

    <div class="col-12 col-xl-6 dashboard-widget" *appHasRoles="[dashboardRoles.importantDates]; type: 'any'">
      <app-dashboard-important-dates></app-dashboard-important-dates>
    </div>

    <div class="col-12 col-xl-6 dashboard-widget dashboard-widget--timesheet" *appHasRoles="[dashboardRoles.timesheet, dashboardRoles.dashboardTimesheet]; type: 'any'">
      <app-dashboard-timesheet></app-dashboard-timesheet>
    </div>

    <div class="col-12 dashboard-widget" *appHasRoles="[dashboardRoles.upcomingQuotes]; type: 'any'">
      <app-upcoming-quotes></app-upcoming-quotes>
    </div>
  </div>
</div>
