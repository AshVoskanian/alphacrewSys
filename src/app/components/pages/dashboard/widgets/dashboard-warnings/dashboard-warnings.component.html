<app-card
  [headerTitle]="'Warnings'"
  [headerBtnText]="'Add Warning'"
  [padding]="false"
  (headerBtnAction)="openAddModal()">

  @if (loading()) {
    <div class="h-300 w-100 flex items-center justify-content-center">
      <p class="text-primary f-24">Loading...</p>
    </div>
  } @else {
    <div class="recent-table table-responsive currency-table recent-order-table custom-scrollbar">
      @if (tableConfig?.data?.length) {
        <app-table
          [tableConfig]="tableConfig"
          [pageSize]="tableConfig?.data?.length"
          [maxHeight]="400"
          [hasCheckbox]="true"
          [pagination]="false"
          (action)="handleTableAction($event)">
        </app-table>
      }
    </div>
  }
</app-card>

<ng-template #addUpdateWarning>
  <app-warning-add-update
    [loading]="modalLoading()"
    [selectedWarning]="selectedWarning()"
    (closeModal)="closeAddUpdateModal($event)">
  </app-warning-add-update>
</ng-template>
