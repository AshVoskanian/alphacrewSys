<form class="modal-content" [formGroup]="form" (ngSubmit)="save()">
  <div class="modal-body social-profile text-start dark-sign-up">
    <div class="modal-toggle-wrapper">
      <div class="common-flex justify-content-between align-items-center m-b-10">
        <h6 class="text-primary">Edit Document</h6>

        <div class="common-flex align-items-center gap-3">
          <button class="btn-close py-0 float-end" type="button" (click)="closeModal.emit(null)"></button>
        </div>
      </div>

      <div class="flex flex-col gap-12">
        <div>
          <label class="form-label" for="editDocumentType">
            Document Type <span class="text-danger" aria-hidden="true">*</span>
          </label>
          <select2
            id="editDocumentType"
            [data]="typeOptions()"
            [templates]="template"
            formControlName="documentType"
            placeholder="Select Document Type"
          >
            <ng-template #template let-item="label">
              {{ item }}
            </ng-template>
          </select2>
        </div>

        <div>
          <label class="form-label" for="editExpireDate">
            Expiry Date <span class="text-danger" aria-hidden="true">*</span>
          </label>
          <input
            id="editExpireDate"
            class="form-control digits"
            type="date"
            formControlName="expireDate"
          >
        </div>

        <div>
          <label class="form-label" for="editDocumentName">
            Name <span class="text-danger" aria-hidden="true">*</span>
          </label>
          <div class="flex flex-col gap-6">
            <input
              id="editDocumentName"
              class="form-control"
              type="text"
              maxlength="100"
              formControlName="fileName"
              placeholder="Document name"
            >
            @if (fullFileNamePreview()) {
              <span class="f-12 text-break text-info">{{ fullFileNamePreview() }}</span>
            }
          </div>
        </div>

        <div>
          <label class="form-label">File</label>
          <div class="flex items-center gap-12">
            <input
              #fileInput
              class="hidden"
              hidden
              type="file"
              accept=".png,.jpg,.jpeg,.gif,.pdf,.doc,.docx"
              (change)="onFileSelected($event)"
            >
            <button
              type="button"
              class="btn btn-outline-primary h-36"
              (click)="fileInput.click()"
            >
              Choose File
            </button>
            <span class="text-muted f-12">
              {{ selectedFileName() || 'No file selected' }}
            </span>
          </div>
        </div>
      </div>

      <div class="flex items-center justify-content-end m-t-12 w-100">
        <button
          type="submit"
          class="btn btn-primary text-center position-relative"
          [disabled]="form.invalid || loading"
        >
          Save
          @if (loading) {
            <i class="inherit-params t-10 r-10 position-absolute fa-solid fa-circle-notch fa-spin"></i>
          }
        </button>
      </div>
    </div>
  </div>
</form>
