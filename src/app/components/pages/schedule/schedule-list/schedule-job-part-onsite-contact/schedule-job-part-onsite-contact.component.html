<h6 class="m-0 job-part-onsite-contact-cell" (click)="$event.stopPropagation()">
  <button
    type="button"
    class="btn p-0 m-0 job-part-onsite-contact-cell__btn text-start"
    [class.fw-bold]="true"
    [class.fst-italic]="!!onsiteContactDisplay"
    [class.text-danger]="!onsiteContactDisplay"
    [class.pulse]="!onsiteContactDisplay"
    #onsiteContactPop="ngbPopover"
    [ngbPopover]="onsiteContactPopoverTpl"
    triggers="manual"
    placement="auto"
    [autoClose]="'outside'"
    container="body"
    popoverClass="job-part-onsite-contact-popover"
    [disabled]="savingOnsiteContact()"
    (click)="onOnsiteContactTriggerClick(onsiteContactPop, $event)"
    (hidden)="onOnsiteContactPopoverHidden()"
  >
    @if (savingOnsiteContact()) {
      <i class="fa-solid fa-spinner fa-spin f-14" title="Saving…"></i>
    } @else if (onsiteContactDisplay) {
      <span>Onsite: {{ onsiteContactDisplay }}</span>
    } @else {
      <span class="job-part-onsite-contact-cell__missing" title="Add onsite contact">
        <i class="fa-solid fa-warning text-danger" aria-hidden="true"></i>
        Onsite Contact Missing
      </span>
    }
  </button>
</h6>

<ng-template #onsiteContactPopoverTpl>
  <div class="d-flex flex-column gap-2 p-1" style="min-width: 14rem;">
    <div class="d-flex align-items-stretch gap-1">
      <input
        type="text"
        class="form-control form-control-sm flex-grow-1"
        name="onsiteContactDraft"
        [ngModel]="onsiteContactEditDraft"
        [ngModelOptions]="{ standalone: true }"
        (ngModelChange)="onOnsiteContactDraftChange($event)"
        (keydown)="onOnsiteContactInputKeydown($event)"
        [disabled]="savingOnsiteContact()"
        placeholder="Type onsite contact"
      />
      <button
        type="button"
        class="btn btn-light border btn-sm px-2 py-0 d-flex align-items-center justify-content-center txt-primary flex-shrink-0"
        [disabled]="savingOnsiteContact()"
        (click)="commitOnsiteContactFromPopover($event)"
        title="Save onsite contact"
      >
        @if (savingOnsiteContact()) {
          <i class="fa-solid fa-spinner fa-spin f-14"></i>
        } @else {
          <i class="fa-solid fa-check f-14"></i>
        }
      </button>
    </div>
  </div>
</ng-template>
